# Coturn configuration for OmniAssist NAT traversal (STUN + TURN relay).
#
# Coturn relays ENCRYPTED media (DTLS-SRTP) when a direct peer-to-peer path
# cannot be established. It cannot decrypt anything it relays. No media is
# stored. Replace ${...} via the docker-compose environment / entrypoint.

listening-port=3478
# TLS relay (recommended; point at your certs or terminate TLS upstream).
# tls-listening-port=5349
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem

# Public IP of the OCI instance (set to the reserved public IP).
external-ip=${TURN_PUBLIC_IP}
realm=${TURN_REALM}
server-name=${TURN_REALM}

# Ephemeral credentials via the REST API (time-limited HMAC), matching the
# signaling server's TURN_STATIC_SECRET. No long-lived user database.
use-auth-secret
static-auth-secret=${TURN_STATIC_SECRET}

# Relay port range. Open these UDP ports in the OCI security list + instance
# firewall, or TURN relay will silently fail and sessions fall back to nothing.
min-port=49160
max-port=49200

# Hardening.
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1
# Refuse to relay to private/loopback ranges (prevents SSRF-style abuse).
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
fingerprint
stale-nonce=600
# Keep logs lean on the Always Free disk.
no-stdout-log
simple-log
log-file=stdout
