openapi: 3.1.0
info:
  title: goonersPAY Merchant and BaaS API
  version: "2026-10-01"
  summary: Acquiring, sub-ledger accounts, payouts, disputes, settlements and receipts.
  description: |
    Machine-readable contract for docs/02-api-reference.md.

    * Money is an integer in minor units plus an ISO 4217 code.
    * Every POST accepts an `Idempotency-Key` header.
    * Errors are RFC 9457 Problem Details.
    * PANs are accepted only on the vault host; card-present authorizations only on the terminal host.
  license:
    name: Proprietary (specification draft)
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.goonerspay.example
    description: Core API (out of PCI scope)
  - url: https://vault.goonerspay.example
    description: Card vault (CDE)
  - url: https://terminal.goonerspay.example
    description: Card-present terminals (CDE)
  - url: https://api.sandbox.goonerspay.example
    description: Sandbox
security:
  - mtlsBoundToken: []
tags:
  - name: auth
    description: Token and session issuance
  - name: payments
    description: Payment intents, terminal authorizations, refunds
  - name: vault
    description: Payment methods (CDE)
  - name: disputes
    description: Chargebacks and evidence
  - name: accounts
    description: Sub-ledger accounts and transfers
  - name: payouts
    description: Quotes and payouts (instant settlement)
  - name: merchants
    description: Onboarding, devices and terminals
  - name: settlements
    description: Daily statements and inclusion proofs
  - name: webhooks
    description: Webhook endpoints

paths:
  /oauth2/token:
    post:
      tags: [auth]
      operationId: issueToken
      summary: Issue an mTLS-bound access token (client credentials)
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, client_id]
              properties:
                grant_type:
                  type: string
                  const: client_credentials
                client_id:
                  type: string
                scope:
                  type: string
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"

  /v1/auth/nostr:
    post:
      tags: [auth]
      operationId: nostrLogin
      summary: Exchange a NIP-98 event for a DPoP-bound session
      security:
        - nostrHttpAuth: []
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dpop_jwk]
              properties:
                dpop_jwk:
                  type: object
                  description: The P-256 public key (JWK) the session is bound to. Every request then carries a DPoP proof signed by it (RFC 9449).
                  additionalProperties: true
                device_id:
                  $ref: "#/components/schemas/Id"
                attestation:
                  type: object
                  description: Platform attestation evidence, sent when a login is refused with `attestation_required` (a phone the owner added). Same forms as at enrollment.
                  additionalProperties: true
      responses:
        "200":
          description: Session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Problem"

  /v1/enrollment:
    get:
      tags: [auth]
      operationId: lookupEnrollment
      summary: Resolve an enrollment code before building the device list
      description: |
        A phone presents a single-use enrollment code (Authorization: Enrollment <code>) and learns
        which merchant it is enrolling for, and whether the merchant already has a root key.
        Without one, this phone creates it.
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
      responses:
        "200":
          description: The merchant behind the code
          content:
            application/json:
              schema:
                type: object
                required: [merchant_id, trade_name, expires_at]
                properties:
                  merchant_id:
                    $ref: "#/components/schemas/Id"
                  trade_name:
                    type: string
                  root_npub:
                    $ref: "#/components/schemas/Npub"
                  expires_at:
                    $ref: "#/components/schemas/Timestamp"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags: [auth]
      operationId: enrollDevice
      summary: Enroll this phone with a single-use code
      description: |
        Same body as POST /v1/merchants/{id}/devices. The code is spent. On the merchant's first
        enrollment the device list's signer becomes the merchant's root key.
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceCreate"
      responses:
        "201":
          description: Device enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "4XX":
          $ref: "#/components/responses/Problem"

  /v1/merchants/{id}/enrollment-codes:
    post:
      tags: [merchants]
      operationId: createEnrollmentCode
      summary: Create a single-use enrollment code for a phone (valid 15 minutes)
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/PathId"
      responses:
        "201":
          description: Code created; only its hash is stored
          content:
            application/json:
              schema:
                type: object
                required: [code, merchant_id, expires_at]
                properties:
                  code:
                    type: string
                    pattern: "^[A-Z2-7]{4}-[A-Z2-7]{4}-[A-Z2-7]{4}$"
                  merchant_id:
                    $ref: "#/components/schemas/Id"
                  expires_at:
                    $ref: "#/components/schemas/Timestamp"
        "4XX":
          $ref: "#/components/responses/Problem"

  /v1/payment-intents:
    post:
      tags: [payments]
      operationId: createPaymentIntent
      summary: Create a payment intent
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentIntentCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntent"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /v1/payment-intents/{id}:
    get:
      tags: [payments]
      operationId: getPaymentIntent
      summary: Retrieve a payment intent
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: The payment intent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntent"
        "404":
          $ref: "#/components/responses/Problem"

  /v1/payment-intents/{id}/confirm:
    post:
      tags: [payments]
      operationId: confirmPaymentIntent
      summary: Confirm with a card (3DS) or Pix
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentIntentConfirm"
      responses:
        "200":
          description: Updated payment intent (may require action)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntent"
        "402":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"

  /v1/payment-intents/{id}/capture:
    post:
      tags: [payments]
      operationId: capturePaymentIntent
      summary: Capture an authorized payment intent
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  $ref: "#/components/schemas/MinorUnits"
      responses:
        "200":
          description: Captured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntent"
        "409":
          $ref: "#/components/responses/Problem"

  /v1/payment-intents/{id}/cancel:
    post:
      tags: [payments]
      operationId: cancelPaymentIntent
      summary: Cancel (reverse) before clearing
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  enum: [requested_by_customer, duplicate, fraudulent, abandoned]
      responses:
        "200":
          description: Canceled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntent"
        "409":
          $ref: "#/components/responses/Problem"

  /v1/terminal/journal:
    post:
      tags: [terminals]
      operationId: uploadTerminalJournal
      summary: Upload the device's signed, hash-chained journal entries (kind 7714)
      description: |
        App sessions only; every entry must be signed by the session's device key and name the
        merchant's root key. Entries are stored in seq order; re-sent entries count as duplicates.
        The answer is the HTTPS form of the 27711 / 27712 reconciliation (docs/03 §9): `missing`
        lists the seq ranges the platform lacks, and a second entry at a stored seq, or a prev that
        is not the entry before it, is kept as proof of a fork and freezes the device's terminal.
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    $ref: "#/components/schemas/NostrEvent"
      responses:
        "200":
          description: The platform's view of the journal after the upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalStatus"
        "4XX":
          $ref: "#/components/responses/Problem"
    get:
      tags: [terminals]
      operationId: getTerminalJournal
      summary: The platform's view of this device's journal
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
      responses:
        "200":
          description: Journal state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalStatus"
        "4XX":
          $ref: "#/components/responses/Problem"

  /v1/payment-intents/{id}/journal:
    get:
      tags: [payments]
      operationId: getPaymentJournal
      summary: The devices' signed journal entries about a payment (dispute evidence)
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Entries in device and seq order
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/NostrEvent"
        "4XX":
          $ref: "#/components/responses/Problem"

  /v1/terminal/authorizations:
    post:
      tags: [payments]
      operationId: authorizeCardPresent
      summary: Card-present authorization from an MPoC terminal (terminal host, CDE)
      servers:
        - url: https://terminal.goonerspay.example
      security:
        - terminalCert: []
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminalAuthorizationRequest"
      responses:
        "200":
          description: Authorization result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalAuthorizationResult"
        "401":
          $ref: "#/components/responses/Problem"

  /v1/refunds:
    post:
      tags: [payments]
      operationId: createRefund
      summary: Refund a captured payment
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_intent_id]
              properties:
                payment_intent_id:
                  $ref: "#/components/schemas/Id"
                amount:
                  $ref: "#/components/schemas/MinorUnits"
                reason:
                  type: string
                  enum: [requested_by_customer, duplicate, fraudulent, product_not_received]
                metadata:
                  $ref: "#/components/schemas/Metadata"
      responses:
        "201":
          description: Refund created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
        "422":
          $ref: "#/components/responses/Problem"

  /v1/refunds/{id}:
    get:
      tags: [payments]
      operationId: getRefund
      summary: Retrieve a refund
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: The refund
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
        "404":
          $ref: "#/components/responses/Problem"

  /v1/payment-methods:
    post:
      tags: [vault]
      operationId: createPaymentMethod
      summary: Tokenize a card (vault host, CDE)
      servers:
        - url: https://vault.goonerspay.example
      security:
        - mtlsBoundToken: []
        - publishableKey: []
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentMethodCreate"
      responses:
        "201":
          description: Payment method created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethod"
        "422":
          $ref: "#/components/responses/Problem"

  /v1/payment-methods/{id}:
    delete:
      tags: [vault]
      operationId: deletePaymentMethod
      summary: Delete a payment method and its network tokens
      servers:
        - url: https://vault.goonerspay.example
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/PathId"
      responses:
        "204":
          description: Deleted
        "4XX":
          $ref: "#/components/responses/Problem"

  /v1/disputes:
    get:
      tags: [disputes]
      operationId: listDisputes
      summary: List disputes
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/DisputeStatus"
        - name: merchant_id
          in: query
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "200":
          description: A page of disputes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Dispute"
        "4XX":
          $ref: "#/components/responses/Problem"

  /v1/disputes/{id}:
    get:
      tags: [disputes]
      operationId: getDispute
      summary: Retrieve a dispute
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: The dispute
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dispute"
        "404":
          $ref: "#/components/responses/Problem"

  /v1/disputes/{id}/evidence:
    post:
      tags: [disputes]
      operationId: submitDisputeEvidence
      summary: Attach and optionally submit evidence
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                explanation:
                  type: string
                  maxLength: 4000
                use_auto_evidence:
                  type: boolean
                  default: true
                submit:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Updated dispute
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dispute"
        "4XX":
          $ref: "#/components/responses/Problem"

  /v1/disputes/{id}/accept:
    post:
      tags: [disputes]
      operationId: acceptDispute
      summary: Accept liability
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Updated dispute
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dispute"
        "4XX":
          $ref: "#/components/responses/Problem"

  /v1/accounts:
    post:
      tags: [accounts]
      operationId: createAccount
      summary: Open a sub-ledger account
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [holder, type, currency]
              properties:
                holder:
                  $ref: "#/components/schemas/AccountHolder"
                type:
                  type: string
                  enum: [wallet, reserve]
                currency:
                  $ref: "#/components/schemas/Currency"
                nickname:
                  type: string
                metadata:
                  $ref: "#/components/schemas/Metadata"
      responses:
        "201":
          description: Account opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "4XX":
          $ref: "#/components/responses/Problem"

  /v1/accounts/{id}/balance:
    get:
      tags: [accounts]
      operationId: getBalance
      summary: Balance by availability
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Balance"
        "4XX":
          $ref: "#/components/responses/Problem"

  /v1/accounts/{id}/entries:
    get:
      tags: [accounts]
      operationId: listEntries
      summary: Immutable ledger postings for the account
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/PathId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
      responses:
        "200":
          description: A page of entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Entry"
        "4XX":
          $ref: "#/components/responses/Problem"

  /v1/transfers:
    post:
      tags: [accounts]
      operationId: createTransfer
      summary: Move funds between accounts of one tenant
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_account, to_account, amount]
              properties:
                from_account:
                  $ref: "#/components/schemas/Id"
                to_account:
                  $ref: "#/components/schemas/Id"
                amount:
                  $ref: "#/components/schemas/MinorUnits"
                description:
                  type: string
                  maxLength: 140
      responses:
        "201":
          description: Posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "422":
          $ref: "#/components/responses/Problem"

  /v1/payouts/quotes:
    post:
      tags: [payouts]
      operationId: quotePayout
      summary: Price a payout, including any advance of pending receivables
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id, amount, speed, destination]
              properties:
                account_id:
                  $ref: "#/components/schemas/Id"
                amount:
                  $ref: "#/components/schemas/MinorUnits"
                speed:
                  type: string
                  enum: [instant, standard]
                destination:
                  $ref: "#/components/schemas/PixDestination"
      responses:
        "201":
          description: Quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutQuote"
        "4XX":
          $ref: "#/components/responses/Problem"

  /v1/payouts:
    post:
      tags: [payouts]
      operationId: createPayout
      summary: Execute a quoted payout (requires an HTTP Message Signature)
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: Signature
          in: header
          required: true
          description: RFC 9421 signature over method, path, content-digest and idempotency-key.
          schema:
            type: string
        - name: Signature-Input
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quote_id]
              properties:
                quote_id:
                  $ref: "#/components/schemas/Id"
      responses:
        "201":
          description: Payout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payout"
        "410":
          $ref: "#/components/responses/Problem"

  /v1/merchants:
    post:
      tags: [merchants]
      operationId: createMerchant
      summary: Start merchant onboarding (KYB)
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MerchantCreate"
      responses:
        "201":
          description: Merchant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Merchant"
        "4XX":
          $ref: "#/components/responses/Problem"

  /v1/merchants/{id}/devices:
    post:
      tags: [merchants]
      operationId: bindDevice
      summary: Bind a device key authorized by the merchant root key
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceCreate"
      responses:
        "201":
          description: Device bound
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "422":
          $ref: "#/components/responses/Problem"

  /v1/terminals:
    post:
      tags: [merchants]
      operationId: registerTerminal
      summary: Register a terminal (DE 41) and bind its attested mTLS certificate
      description: |
        Binds a terminal ID to a merchant. certificate_sha256 is the fingerprint of the terminal's
        mutual-TLS certificate, issued by the terminal PKI after device attestation (docs/05 §2.4);
        requests on the terminal host are authenticated by that certificate. Sending a CSR for the
        platform to sign returns 501 until the terminal PKI is enabled.
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [merchant_id]
              properties:
                merchant_id:
                  $ref: "#/components/schemas/Id"
                device_id:
                  $ref: "#/components/schemas/Id"
                type:
                  type: string
                  enum: [mpoc_cots, ble_reader, smart_pos]
                certificate_sha256:
                  type: string
                  pattern: "^[0-9a-f]{64}$"
                csr:
                  type: string
                  contentEncoding: base64
      responses:
        "201":
          description: Terminal registered
          content:
            application/json:
              schema:
                type: object
                required: [terminal_id, merchant_id, status]
                properties:
                  terminal_id:
                    type: string
                    pattern: "^[A-Z0-9]{8}$"
                  object:
                    const: terminal
                  merchant_id:
                    $ref: "#/components/schemas/Id"
                  type:
                    type: string
                  status:
                    type: string
                    enum: [active, revoked]
        "501":
          $ref: "#/components/responses/Problem"
        "4XX":
          $ref: "#/components/responses/Problem"

  /v1/terminals/{terminal_id}/revoke:
    post:
      tags: [merchants]
      operationId: revokeTerminal
      summary: Revoke a terminal (lost, stolen or decommissioned device)
      description: |
        The terminal's certificate stops authenticating and its terminal ID takes no further
        authorizations. Revocation is permanent and recorded in the audit trail; register a new
        terminal for a replacement device. Sends terminal.revoked.
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: terminal_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Z0-9]{8}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        "200":
          description: Terminal revoked
          content:
            application/json:
              schema:
                type: object
                required: [terminal_id, merchant_id, status]
                properties:
                  terminal_id:
                    type: string
                  object:
                    const: terminal
                  merchant_id:
                    $ref: "#/components/schemas/Id"
                  type:
                    type: string
                  status:
                    const: revoked
        "409":
          $ref: "#/components/responses/Problem"
        "4XX":
          $ref: "#/components/responses/Problem"

  /v1/settlements:
    get:
      tags: [settlements]
      operationId: listSettlements
      summary: List daily settlement statements, newest day first
      description: An app session sees only its own merchant's statements.
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - name: merchant_id
          in: query
          schema:
            $ref: "#/components/schemas/Id"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: starting_after
          in: query
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "200":
          description: A page of settlements
          content:
            application/json:
              schema:
                type: object
                required: [data, has_more]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Settlement"
                  has_more:
                    type: boolean
                  next_cursor:
                    type: [string, "null"]
        "4XX":
          $ref: "#/components/responses/Problem"

  /v1/settlements/{id}/statement:
    get:
      tags: [settlements]
      operationId: getSettlementStatement
      summary: The signed kind 7713 statement, as gift-wrapped to the merchant's keys
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Signed statement event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NostrEvent"
        "4XX":
          $ref: "#/components/responses/Problem"

  /v1/transparency/{date}:
    get:
      tags: [settlements]
      operationId: getTransparencyRoot
      summary: A day's public settlement transparency root (kind 7715)
      description: Public data, served without credentials so anyone can check a merchant's proof (docs/03 §6.5).
      security: []
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The day's root
          content:
            application/json:
              schema:
                type: object
                required: [date, tree_size, root, event]
                properties:
                  date:
                    type: string
                    format: date
                  tree_size:
                    type: integer
                  root:
                    $ref: "#/components/schemas/Hex32"
                  prev_event_id:
                    $ref: "#/components/schemas/Hex32"
                  event:
                    $ref: "#/components/schemas/NostrEvent"
                  created_at:
                    type: string
                    format: date-time
        "4XX":
          $ref: "#/components/responses/Problem"

  /v1/settlements/{id}:
    get:
      tags: [settlements]
      operationId: getSettlement
      summary: Retrieve a daily settlement statement
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Settlement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settlement"
        "4XX":
          $ref: "#/components/responses/Problem"

  /v1/settlements/{id}/proofs/{receipt_event_id}:
    get:
      tags: [settlements]
      operationId: getInclusionProof
      summary: Inclusion proof of a receipt in a statement and of the statement in the transparency log
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/PathId"
        - name: receipt_event_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Hex32"
      responses:
        "200":
          description: Proof
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InclusionProof"
        "4XX":
          $ref: "#/components/responses/Problem"

  /v1/webhook-endpoints:
    post:
      tags: [webhooks]
      operationId: createWebhookEndpoint
      summary: Register a webhook endpoint
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url:
                  type: string
                  format: uri
                events:
                  type: array
                  items:
                    type: string
                signature_scheme:
                  type: string
                  enum: [v1, v1a]
                  default: v1
      responses:
        "201":
          description: Endpoint created (the secret is returned once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    $ref: "#/components/schemas/Id"
                  url:
                    type: string
                    format: uri
                  secret:
                    type: string
                    pattern: "^whsec_[A-Za-z0-9+/=]+$"
        "4XX":
          $ref: "#/components/responses/Problem"

  /v1/webhook-endpoints/{id}/replay:
    post:
      tags: [webhooks]
      operationId: replayWebhooks
      summary: Replay deliveries for a time range
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [since]
              properties:
                since:
                  type: string
                  format: date-time
                until:
                  type: string
                  format: date-time
      description: |
        Schedules every delivery of the endpoint created in [since, until) again, delivered or
        not, with its original webhook-id so the receiver can deduplicate. At most the last 30
        days and 10 000 deliveries per call.
      responses:
        "202":
          description: Replay scheduled
          content:
            application/json:
              schema:
                type: object
                required: [replayed]
                properties:
                  replayed:
                    type: integer
                    minimum: 0
        "4XX":
          $ref: "#/components/responses/Problem"

webhooks:
  paymentIntentCaptured:
    post:
      summary: payment_intent.captured
      description: Signed per the Standard Webhooks specification (webhook-id, webhook-timestamp, webhook-signature).
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEvent"
      responses:
        "200":
          description: Acknowledged
      operationId: onPaymentIntentCaptured

components:
  securitySchemes:
    mtlsBoundToken:
      type: http
      scheme: bearer
      bearerFormat: JWT (RFC 8705 certificate-bound)
      description: OAuth 2.0 access token bound to the TLS client certificate (cnf.x5t#S256).
    nostrHttpAuth:
      type: http
      scheme: nostr
      description: NIP-98 HTTP Auth event (kind 27235), base64 in the Authorization header.
    terminalCert:
      type: mutualTLS
      description: Terminal certificate issued after device attestation.
    publishableKey:
      type: apiKey
      in: header
      name: X-Publishable-Key
      description: Browser key for hosted fields; can only create payment methods.

  parameters:
    ApiVersion:
      name: Api-Version
      in: header
      required: true
      schema:
        type: string
        pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        example: "2026-10-01"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 64
    PathId:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    StartingAfter:
      name: starting_after
      in: query
      schema:
        $ref: "#/components/schemas/Id"

  responses:
    Problem:
      description: Problem Details (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Id:
      type: string
      pattern: "^[a-z0-9]+(_[a-z0-9]+)*_[0-9A-HJKMNP-TV-Z]{26}$"
      description: Prefixed ULID, for example pi_01JBK3T2W8C9M4N5P6Q7R8S9TA.
    Hex32:
      type: string
      pattern: "^[0-9a-f]{64}$"
    Npub:
      type: string
      pattern: "^npub1[02-9ac-hj-np-z]{58}$"
    MinorUnits:
      type: integer
      minimum: 0
      maximum: 99999999999
      description: Amount in minor units (centavos for BRL).
    Currency:
      type: string
      enum: [BRL, USD]
    Metadata:
      type: object
      maxProperties: 20
      additionalProperties:
        type: string
        maxLength: 500
    Timestamp:
      type: string
      format: date-time

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        decline_code:
          $ref: "#/components/schemas/DeclineCode"
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        retryable:
          type: boolean
        customer_message:
          type: string

    DeclineCode:
      type: string
      enum:
        - do_not_honor
        - invalid_number
        - insufficient_funds
        - expired_card
        - incorrect_pin
        - not_permitted
        - limit_exceeded
        - authentication_required
        - issuer_unavailable
        - processing_error
        - incorrect_cvc
        - stop_recurring
        - risk_declined

    ListEnvelope:
      type: object
      required: [data, has_more]
      properties:
        data:
          type: array
          items: {}
        has_more:
          type: boolean
        next_cursor:
          type: [string, "null"]

    AccessToken:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
        scope:
          type: string

    Session:
      type: object
      required: [session_token, token_type, expires_in, merchant_id, device_id]
      properties:
        session_token:
          type: string
        token_type:
          type: string
          const: DPoP
        expires_in:
          type: integer
        merchant_id:
          $ref: "#/components/schemas/Id"
        device_id:
          $ref: "#/components/schemas/Id"
        terminal_id:
          type: string
        account_id:
          $ref: "#/components/schemas/Id"
        scopes:
          type: array
          items:
            type: string

    Installments:
      type: object
      required: [count, type]
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 21
        type:
          type: string
          enum: [none, merchant, issuer]

    Split:
      type: object
      required: [account_id, amount]
      properties:
        account_id:
          $ref: "#/components/schemas/Id"
        amount:
          $ref: "#/components/schemas/MinorUnits"
        bears_fees:
          type: boolean
          default: false

    PaymentIntentCreate:
      type: object
      required: [amount, currency, merchant_id, payment_method_types]
      properties:
        amount:
          $ref: "#/components/schemas/MinorUnits"
        currency:
          $ref: "#/components/schemas/Currency"
        merchant_id:
          $ref: "#/components/schemas/Id"
        channel:
          type: string
          enum: [card_present, ecommerce, payment_link, moto]
        payment_method_types:
          type: array
          minItems: 1
          items:
            type: string
            enum: [card, pix]
        capture_method:
          type: string
          enum: [automatic, manual]
          default: automatic
        installments:
          $ref: "#/components/schemas/Installments"
        statement_descriptor:
          type: string
          maxLength: 22
        description:
          type: string
          maxLength: 500
        customer:
          type: object
          properties:
            email:
              type: string
              format: email
            document:
              type: object
              properties:
                type:
                  type: string
                  enum: [cpf, cnpj]
                number:
                  type: string
                  pattern: "^[0-9]{11}([0-9]{3})?$"
        splits:
          type: array
          items:
            $ref: "#/components/schemas/Split"
        split_reversal:
          type: string
          enum: [pro_rata, primary_only]
          default: pro_rata
        receipt:
          type: object
          properties:
            nostr:
              type: boolean
              default: true
            recipient_npub:
              oneOf:
                - $ref: "#/components/schemas/Npub"
                - type: "null"
        metadata:
          $ref: "#/components/schemas/Metadata"

    PaymentIntentConfirm:
      type: object
      properties:
        payment_method:
          $ref: "#/components/schemas/Id"
        payment_method_type:
          type: string
          enum: [card, pix]
        three_ds:
          type: object
          properties:
            mode:
              type: string
              enum: [automatic, required, skip_if_exempt]
            return_url:
              type: string
              format: uri
            browser:
              type: object
              additionalProperties: true

    PaymentIntentStatus:
      type: string
      enum:
        - requires_payment_method
        - requires_confirmation
        - requires_action
        - processing
        - authorized
        - captured
        - partially_refunded
        - refunded
        - disputed
        - canceled
        - failed

    NextAction:
      oneOf:
        - type: object
          required: [type, three_ds_session, acs_url, creq]
          properties:
            type:
              const: three_ds_challenge
            three_ds_session:
              type: string
            acs_url:
              type: string
              format: uri
            creq:
              type: string
            message_version:
              type: string
            expires_at:
              $ref: "#/components/schemas/Timestamp"
        - type: object
          required: [type, txid, br_code]
          properties:
            type:
              const: pix_qr
            txid:
              type: string
              pattern: "^[a-zA-Z0-9]{26,35}$"
            br_code:
              type: string
            expires_at:
              $ref: "#/components/schemas/Timestamp"

    Attempt:
      type: object
      properties:
        type:
          type: string
          enum: [card, pix]
        card:
          type: object
          properties:
            brand:
              type: string
              enum: [visa, mastercard, elo, amex, hipercard]
            last4:
              type: string
              pattern: "^[0-9]{4}$"
            funding:
              type: string
              enum: [credit, debit, prepaid]
            network_token_used:
              type: boolean
            issuer_country:
              type: string
        three_ds:
          type: object
          properties:
            status:
              type: string
            trans_status:
              type: string
              enum: ["Y", "A", "C", "D", "N", "R", "U", "I"]
            eci:
              type: string
            version:
              type: string
        authorization:
          type: object
          properties:
            code:
              type: string
            response_code:
              type: string
            rrn:
              type: string
              pattern: "^[0-9A-Z]{12}$"
            network_transaction_id:
              type: string
            route:
              type: string
            approved_at:
              $ref: "#/components/schemas/Timestamp"
        decline_code:
          $ref: "#/components/schemas/DeclineCode"

    ReceiptRef:
      type: object
      properties:
        nostr_event_id:
          $ref: "#/components/schemas/Hex32"
        claim_url:
          type: string
          format: uri

    PaymentIntent:
      type: object
      required: [id, object, status, amount, currency]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        object:
          const: payment_intent
        status:
          $ref: "#/components/schemas/PaymentIntentStatus"
        amount:
          $ref: "#/components/schemas/MinorUnits"
        amount_capturable:
          $ref: "#/components/schemas/MinorUnits"
        amount_captured:
          $ref: "#/components/schemas/MinorUnits"
        amount_refunded:
          $ref: "#/components/schemas/MinorUnits"
        currency:
          $ref: "#/components/schemas/Currency"
        merchant_id:
          $ref: "#/components/schemas/Id"
        channel:
          type: string
        payment_method_types:
          type: array
          items:
            type: string
        capture_method:
          type: string
        installments:
          $ref: "#/components/schemas/Installments"
        client_secret:
          type: string
        splits:
          type: array
          items:
            $ref: "#/components/schemas/Split"
        next_action:
          $ref: "#/components/schemas/NextAction"
        latest_attempt:
          oneOf:
            - $ref: "#/components/schemas/Attempt"
            - type: "null"
        receipt:
          oneOf:
            - $ref: "#/components/schemas/ReceiptRef"
            - type: "null"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        metadata:
          $ref: "#/components/schemas/Metadata"

    TerminalAuthorizationRequest:
      type: object
      required: [payment_intent_id, terminal_id, stan, sred, attestation]
      properties:
        payment_intent_id:
          $ref: "#/components/schemas/Id"
        terminal_id:
          type: string
          pattern: "^[A-Z0-9]{8}$"
        stan:
          type: string
          pattern: "^[0-9]{6}$"
        local_time:
          type: string
          format: date-time
        emv_application:
          type: string
          enum: [credit, debit]
        sred:
          $ref: "#/components/schemas/EncryptedBlob"
        pin:
          oneOf:
            - $ref: "#/components/schemas/EncryptedBlob"
            - type: "null"
        device_risk:
          type: object
          properties:
            score:
              type: number
              minimum: 0
              maximum: 1
            model:
              type: string
            signals:
              type: array
              items:
                type: string
        attestation:
          type: object
          required: [verdict_token]
          properties:
            verdict_token:
              type: string
            obtained_at:
              $ref: "#/components/schemas/Timestamp"
        journal_event_id:
          $ref: "#/components/schemas/Hex32"

    EncryptedBlob:
      type: object
      required: [format, ksn, ciphertext]
      properties:
        format:
          type: string
        ksn:
          type: string
          pattern: "^[0-9A-F]{20,24}$"
          description: DUKPT key serial number.
        ciphertext:
          type: string
          contentEncoding: base64

    TerminalAuthorizationResult:
      type: object
      required: [status, payment_intent_id]
      properties:
        status:
          type: string
          enum: [approved, declined, pin_required, timeout]
        payment_intent_id:
          $ref: "#/components/schemas/Id"
        response_code:
          type: string
        authorization_code:
          type: string
        rrn:
          type: string
        decline_code:
          $ref: "#/components/schemas/DeclineCode"
        card:
          type: object
          properties:
            brand:
              type: string
            last4:
              type: string
            application_label:
              type: string
            aid:
              type: string
              pattern: "^[0-9A-F]{10,32}$"
        cvm:
          type: string
          enum: [no_cvm, online_pin, consumer_device_cvm, signature]
        issuer_response:
          type: object
          properties:
            arpc_and_scripts:
              type: string
              pattern: "^[0-9A-F]*$"
        receipt:
          type: object
          properties:
            nostr_event_id:
              $ref: "#/components/schemas/Hex32"
            claim_qr:
              type: string
              format: uri
        settlement:
          type: object
          properties:
            mode:
              type: string
              enum: [instant, standard]
            estimated_available_at:
              $ref: "#/components/schemas/Timestamp"

    Refund:
      type: object
      required: [id, object, payment_intent_id, amount, currency, status]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        object:
          const: refund
        payment_intent_id:
          $ref: "#/components/schemas/Id"
        amount:
          $ref: "#/components/schemas/MinorUnits"
        currency:
          $ref: "#/components/schemas/Currency"
        status:
          type: string
          enum: [pending, requires_funding, succeeded, failed]
        method:
          type: string
          enum: [card_credit, pix_return]
        funding:
          type: object
          properties:
            account_id:
              $ref: "#/components/schemas/Id"
            held:
              $ref: "#/components/schemas/MinorUnits"
        created_at:
          $ref: "#/components/schemas/Timestamp"

    PaymentMethodCreate:
      type: object
      required: [type, card]
      properties:
        type:
          const: card
        card:
          type: object
          required: [number, exp_month, exp_year]
          properties:
            number:
              type: string
              pattern: "^[0-9]{12,19}$"
            exp_month:
              type: integer
              minimum: 1
              maximum: 12
            exp_year:
              type: integer
              minimum: 2026
            cvc:
              type: string
              pattern: "^[0-9]{3,4}$"
              writeOnly: true
            holder_name:
              type: string
        customer_reference:
          type: string
        network_token:
          type: string
          enum: [request, skip]
          default: request

    PaymentMethod:
      type: object
      required: [id, object, type, card]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        object:
          const: payment_method
        type:
          const: card
        card:
          type: object
          properties:
            brand:
              type: string
            last4:
              type: string
            exp_month:
              type: integer
            exp_year:
              type: integer
            funding:
              type: string
            issuer_country:
              type: string
            fingerprint:
              type: string
            par:
              type: string
              pattern: "^[A-Z0-9]{29}$"
            network_token:
              type: object
              properties:
                status:
                  type: string
                  enum: [requested, active, suspended, deleted, declined]
                updated_at:
                  $ref: "#/components/schemas/Timestamp"
        created_at:
          $ref: "#/components/schemas/Timestamp"

    DisputeStatus:
      type: string
      enum:
        - alert
        - evidence_required
        - represented
        - pre_arbitration
        - arbitration
        - accepted
        - won
        - lost

    Dispute:
      type: object
      required: [id, object, payment_intent_id, scheme, reason_code, amount, currency, status]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        object:
          const: dispute
        payment_intent_id:
          $ref: "#/components/schemas/Id"
        merchant_id:
          $ref: "#/components/schemas/Id"
        scheme:
          type: string
          enum: [visa, mastercard, elo]
        network_case_id:
          type: string
        reason_code:
          type: string
        category:
          type: string
          enum: [fraud, authorization, processing_error, consumer_dispute]
        amount:
          $ref: "#/components/schemas/MinorUnits"
        currency:
          $ref: "#/components/schemas/Currency"
        status:
          $ref: "#/components/schemas/DisputeStatus"
        evidence_due_at:
          $ref: "#/components/schemas/Timestamp"
        ledger:
          type: object
          description: |
            What the chargeback took from the merchant: from_balance came out of the available
            balance, owed_by_merchant is the shortfall booked as owed and recovered from later credits.
          properties:
            held_from_account:
              $ref: "#/components/schemas/Id"
            amount:
              $ref: "#/components/schemas/MinorUnits"
            from_balance:
              $ref: "#/components/schemas/MinorUnits"
            owed_by_merchant:
              $ref: "#/components/schemas/MinorUnits"
        auto_evidence:
          type: object
          additionalProperties: true
        recommendation:
          type: string
          enum: [represent, accept, refund]
        evidence:
          type: object
          description: The evidence attached with POST /v1/disputes/{id}/evidence.
          additionalProperties: true
        created_at:
          $ref: "#/components/schemas/Timestamp"

    AccountHolder:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          enum: [merchant, sub_merchant, tenant]
        id:
          $ref: "#/components/schemas/Id"

    Account:
      type: object
      required: [id, object, type, currency, holder, status]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        object:
          const: account
        type:
          type: string
        currency:
          $ref: "#/components/schemas/Currency"
        holder:
          $ref: "#/components/schemas/AccountHolder"
        status:
          type: string
          enum: [active, frozen, closed]
        safeguarded:
          type: boolean
        created_at:
          $ref: "#/components/schemas/Timestamp"

    Balance:
      type: object
      required: [account_id, currency, available, pending, as_of]
      properties:
        account_id:
          $ref: "#/components/schemas/Id"
        currency:
          $ref: "#/components/schemas/Currency"
        available:
          type: integer
        pending:
          type: integer
        reserved:
          type: integer
        in_transit:
          type: integer
        instant_eligible:
          type: integer
        pending_by_date:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              amount:
                type: integer
              source:
                type: string
                enum: [debit, credit, credit_installment, pix]
        as_of:
          $ref: "#/components/schemas/Timestamp"
        ledger_version:
          type: integer

    Entry:
      type: object
      required: [id, journal_id, direction, amount, type, posted_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        journal_id:
          $ref: "#/components/schemas/Id"
        direction:
          type: string
          enum: [debit, credit]
        amount:
          $ref: "#/components/schemas/MinorUnits"
        balance_after:
          type: integer
        type:
          type: string
        reference:
          type: string
        posted_at:
          $ref: "#/components/schemas/Timestamp"

    Transfer:
      type: object
      required: [id, object, status, amount, currency, journal_id]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        object:
          const: transfer
        status:
          type: string
          enum: [posted, rejected]
        amount:
          $ref: "#/components/schemas/MinorUnits"
        currency:
          $ref: "#/components/schemas/Currency"
        journal_id:
          $ref: "#/components/schemas/Id"
        posted_at:
          $ref: "#/components/schemas/Timestamp"

    PixDestination:
      type: object
      required: [type, key_type, key]
      properties:
        type:
          const: pix
        key_type:
          type: string
          enum: [cpf, cnpj, email, phone, evp]
        key:
          type: string
          maxLength: 77
          description: >-
            Checked and stored as DICT holds it: CPF and CNPJ as digits with valid check digits (punctuation is removed),
            e-mail in lowercase, phone in E.164 (+5511987654321), EVP as a lowercase UUID. A key that cannot exist is
            refused with 422 before anything reaches the PSP.

    PayoutQuote:
      type: object
      required: [id, object, amount, currency, fee_total, net_to_destination, expires_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        object:
          const: payout_quote
        amount:
          $ref: "#/components/schemas/MinorUnits"
        currency:
          $ref: "#/components/schemas/Currency"
        funding:
          type: object
          properties:
            from_available:
              $ref: "#/components/schemas/MinorUnits"
            advanced:
              $ref: "#/components/schemas/MinorUnits"
            advance_detail:
              type: array
              items:
                type: object
                properties:
                  receivable_date:
                    type: string
                    format: date
                  amount:
                    $ref: "#/components/schemas/MinorUnits"
                  business_days:
                    type: integer
                    description: Business days (DU/252 convention) until the scheme settles this receivable.
                  fee:
                    $ref: "#/components/schemas/MinorUnits"
        fee_total:
          $ref: "#/components/schemas/MinorUnits"
        net_to_destination:
          $ref: "#/components/schemas/MinorUnits"
        effective_monthly_rate_bps:
          type: integer
        risk_tier:
          type: string
          enum: [A, B, C, D]
        expires_at:
          $ref: "#/components/schemas/Timestamp"

    Payout:
      type: object
      required: [id, object, status, amount, currency, rail]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        object:
          const: payout
        status:
          type: string
          enum: [processing, paid, failed, returned]
        amount:
          $ref: "#/components/schemas/MinorUnits"
        currency:
          $ref: "#/components/schemas/Currency"
        rail:
          type: string
          enum: [pix, ted]
        end_to_end_id:
          type: string
          pattern: "^E[0-9]{8}[0-9]{12}[A-Za-z0-9]{11}$"
        destination:
          type: object
          additionalProperties: true
        quote_id:
          $ref: "#/components/schemas/Id"
        paid_at:
          $ref: "#/components/schemas/Timestamp"

    MerchantCreate:
      type: object
      required: [legal, root_npub]
      properties:
        legal:
          type: object
          required: [document, legal_name, mcc]
          properties:
            document:
              type: object
              required: [type, number]
              properties:
                type:
                  type: string
                  enum: [cnpj, cpf]
                number:
                  type: string
                  pattern: "^[0-9]{11}([0-9]{3})?$"
            legal_name:
              type: string
            trade_name:
              type: string
            mcc:
              type: string
              pattern: "^[0-9]{4}$"
            address:
              type: object
              additionalProperties: true
            representatives:
              type: array
              items:
                type: object
                additionalProperties: true
        root_npub:
          $ref: "#/components/schemas/Npub"
        contact:
          type: object
          additionalProperties: true
        settlement:
          type: object
          properties:
            default_speed:
              type: string
              enum: [instant, standard]
            pix_key:
              type: object
              properties:
                type:
                  type: string
                key:
                  type: string
        scheme_mid:
          type: string
          maxLength: 15
          description: Merchant ID sent in DE 42. Assigned by the platform when absent (sub-acquirer model).
        plan:
          type: object
          description: Pricing (basis points per product, risk tier, instant settlement).
          additionalProperties: true

    Merchant:
      type: object
      required: [id, object, status, root_npub]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        object:
          const: merchant
        status:
          type: string
          enum: [kyb_in_review, action_required, active, restricted, closed]
          description: |
            Only active merchants take payments and receive payouts. A restricted merchant's balance
            is held; refunds, disputes and MED returns still debit it.
        status_reason:
          type: string
        kyb:
          type: object
          additionalProperties: true
        root_npub:
          $ref: "#/components/schemas/Npub"
        created_at:
          $ref: "#/components/schemas/Timestamp"

    DeviceCreate:
      type: object
      required: [device_npub, platform, authorization_event]
      properties:
        device_npub:
          $ref: "#/components/schemas/Npub"
        platform:
          type: string
          enum: [android, ios, web]
        model:
          type: string
        attestation:
          type: object
          description: Android key attestation and Play Integrity, or Apple App Attest. Required in production.
          additionalProperties: true
        authorization_event:
          $ref: "#/components/schemas/NostrEvent"

    Device:
      type: object
      required: [id, object, merchant_id, device_npub, status]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        object:
          const: device
        merchant_id:
          $ref: "#/components/schemas/Id"
        device_npub:
          $ref: "#/components/schemas/Npub"
        status:
          type: string
          enum: [active, revoked]
        integrity:
          type: object
          additionalProperties: true
        capabilities:
          type: array
          items:
            type: string
        platform:
          type: string
          enum: [android, ios, web]
        label:
          type: string
        model:
          type: string
        terminal_id:
          type: string
          description: The DE 41 terminal ID of this phone, created when it is first bound.
        created_at:
          $ref: "#/components/schemas/Timestamp"

    Settlement:
      type: object
      required: [id, object, merchant_id, date, currency, gross, fees, net]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        object:
          const: settlement
        merchant_id:
          $ref: "#/components/schemas/Id"
        date:
          type: string
          format: date
        currency:
          $ref: "#/components/schemas/Currency"
        gross:
          type: integer
        fees:
          type: integer
        refunds:
          type: integer
        chargebacks:
          type: integer
        net:
          type: integer
        transaction_count:
          type: integer
        statement:
          type: object
          properties:
            nostr_event_id:
              $ref: "#/components/schemas/Hex32"
            merkle_root:
              $ref: "#/components/schemas/Hex32"
            leaf_count:
              type: integer
        transparency:
          type: object
          properties:
            log_date:
              type: string
              format: date
            root_event_id:
              $ref: "#/components/schemas/Hex32"

    JournalStatus:
      type: object
      required: [status, missing, forks]
      properties:
        status:
          enum: [consistent, platform_behind, fork_detected]
        accepted:
          type: integer
        duplicates:
          type: integer
        head:
          type: [object, "null"]
          properties:
            seq:
              type: integer
            event_id:
              $ref: "#/components/schemas/Hex32"
        missing:
          description: Inclusive seq ranges the platform lacks; the device republishes them.
          type: array
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: integer
        forks:
          type: integer

    InclusionProof:
      type: object
      required: [receipt_event_id, statement_inclusion, transparency_inclusion]
      properties:
        receipt_event_id:
          $ref: "#/components/schemas/Hex32"
        statement_inclusion:
          $ref: "#/components/schemas/MerklePath"
        transparency_inclusion:
          $ref: "#/components/schemas/MerklePath"

    MerklePath:
      type: object
      required: [leaf_index, tree_size, audit_path]
      properties:
        leaf_index:
          type: integer
          minimum: 0
        tree_size:
          type: integer
          minimum: 1
        audit_path:
          type: array
          items:
            $ref: "#/components/schemas/Hex32"
        root:
          $ref: "#/components/schemas/Hex32"

    NostrEvent:
      type: object
      required: [id, pubkey, created_at, kind, tags, content, sig]
      properties:
        id:
          $ref: "#/components/schemas/Hex32"
        pubkey:
          $ref: "#/components/schemas/Hex32"
        created_at:
          type: integer
        kind:
          type: integer
        tags:
          type: array
          items:
            type: array
            items:
              type: string
        content:
          type: string
        sig:
          type: string
          pattern: "^[0-9a-f]{128}$"

    WebhookEvent:
      type: object
      required: [type, timestamp, data]
      properties:
        type:
          type: string
        timestamp:
          $ref: "#/components/schemas/Timestamp"
        data:
          type: object
          additionalProperties: true
