# Local sandbox: PostgreSQL, the ISO 8583 host simulator, the Pix PSP simulator and the platform.
#   docker compose up --build
#   docker compose exec platform platform apikey -tenant 00000000-0000-4000-8000-000000000001
# The keys below are DEVELOPMENT keys for the sandbox only.
services:
  postgres:
    image: postgres:16.10
    environment:
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform"]
      interval: 2s
      retries: 30

  pki:
    build: .
    entrypoint: ["/usr/local/bin/devpki", "-out", "/pki"]
    volumes: ["pki:/pki"]

  schemesim:
    build: .
    entrypoint: ["/usr/local/bin/schemesim", "-listen", ":8583", "-late-delay", "3s"]

  pixsim:
    build: .
    depends_on:
      pki: { condition: service_completed_successfully }
    entrypoint:
      - /usr/local/bin/pixsim
      - -listen=:8443
      - -cert=/pki/pixsim-server.pem
      - -key=/pki/pixsim-server.key
      - -client-ca=/pki/ca.pem
      - -webhook-cert=/pki/pixsim-client.pem
      - -webhook-key=/pki/pixsim-client.key
      - -client-id=platform
      - -client-secret=dev-secret
      - -keys=12345678000195
    volumes: ["pki:/pki:ro"]

  platform:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      pki: { condition: service_completed_successfully }
      schemesim: { condition: service_started }
      pixsim: { condition: service_started }
    ports: ["8080:8080", "127.0.0.1:9090:9090"]
    volumes:
      - pki:/pki:ro
      - ./deploy/routes.sandbox.json:/etc/platform/routes.json:ro
    environment:
      PLATFORM_ENV: sandbox
      DATABASE_URL: postgres://postgres:platform@postgres:5432/platform?sslmode=disable
      HTTP_ADDR: ":8080"
      METRICS_ADDR: ":9090"
      ROUTES_FILE: /etc/platform/routes.json
      ACQUIRER_ID: "12345678"
      VAULT_KEK_HEX: 6b65792d656e6372797074696f6e2d6b65792d666f722d73616e64626f782121
      VAULT_FINGERPRINT_KEY_HEX: 66696e6765727072696e742d6b65792d666f722d73616e64626f782d6f6e6c79
      CARDDATA_DEV_KEY_HEX: 6361726464617461206465762d6b657920666f722073616e64626f78206f6e6c
      RECEIPTS_SECRET_HEX: 7265636569707473207369676e696e67206b65792073616e64626f78206f6e6c
      TRANSPARENCY_SECRET_HEX: 7472616e73706172656e6379207369676e696e67206b65792073616e64626f78
      PIX_BASE_URL: https://pixsim:8443/api/v2
      PIX_TOKEN_URL: https://pixsim:8443/oauth/token
      PIX_CLIENT_ID: platform
      PIX_CLIENT_SECRET: dev-secret
      PIX_KEY: "12345678000195"
      PIX_TLS_CA: /pki/ca.pem
      PIX_TLS_CERT: /pki/platform-client.pem
      PIX_TLS_KEY: /pki/platform-client.key
      PAYOUT_BASE_URL: https://pixsim:8443/api/v2
      PIX_WEBHOOK_ADDR: ":8444"
      PIX_WEBHOOK_TLS_CA: /pki/ca.pem
      PIX_WEBHOOK_TLS_CERT: /pki/platform-server.pem
      PIX_WEBHOOK_TLS_KEY: /pki/platform-server.key
      PIX_WEBHOOK_PUBLIC_URL: https://platform:8444
      BOOTSTRAP_TENANT: 00000000-0000-4000-8000-000000000001
      BOOTSTRAP_CAPITAL: "100000000"

volumes:
  pki: {}
