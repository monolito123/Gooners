name: goonersPAY platform (Go)

on:
  push:
    paths: ['payments/platform/**', 'payments/nostr/examples/**', 'payments/docs/02-api-reference.md', '.github/workflows/payments-platform.yml']
  pull_request:
    paths: ['payments/platform/**', 'payments/nostr/examples/**', 'payments/docs/02-api-reference.md', '.github/workflows/payments-platform.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payments-platform-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: payments/platform

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: payments/platform/go.mod
          cache-dependency-path: payments/platform/go.sum

      - name: Formatação, vet e staticcheck
        run: make lint

      # Testes unitários e de integração (inclusive o fluxo ponta a ponta pela API, simuladores e PostgreSQL).
      - name: Testes (race detector)
        run: go test -race -count=1 ./...

      - name: Fuzz curto (ISO 8583, EMV, BR Code, Nostr, arquivos do subcredenciador)
        run: |
          go test -run=^$ -fuzz=FuzzUnpack -fuzztime=20s ./pkg/iso8583/
          go test -run=^$ -fuzz=FuzzParse -fuzztime=10s ./pkg/emv/
          go test -run=^$ -fuzz=FuzzDecode -fuzztime=10s ./pkg/brcode/
          go test -run=^$ -fuzz=FuzzVerify -fuzztime=10s ./pkg/nostr/
          go test -run=^$ -fuzz=FuzzParseSettlementCSV -fuzztime=10s ./internal/payments/
          go test -run=^$ -fuzz=FuzzParseDisputeCSV -fuzztime=10s ./internal/payments/

      # Os binários reais em processos separados, com sockets e mTLS de verdade.
      - name: Smoke (schemesim + pixsim + platform)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: |
          psql "$DATABASE_URL" -c "CREATE DATABASE smoke"
          DATABASE_URL="postgres://postgres:postgres@localhost:5432/smoke?sslmode=disable" go run ./cmd/smoke

      - name: Vulnerabilidades (govulncheck)
        run: make vuln

      # Achados revisados estão anotados com #nosec e o motivo (payments/integration/security-assessment.md).
      - name: Análise de segurança (gosec)
        run: make sec

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Imagem Docker
        run: docker build -t goonerspay-platform:ci .
      - name: Compose válido
        run: docker compose config -q
