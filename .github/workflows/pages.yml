name: Publicar site e atualizar notícias

on:
  push:
    branches: [main, claude/gooners-interactive-website-xszyfd]
  schedule:
    - cron: '*/15 * * * *'   # coleta as notícias jurídicas a cada 15 minutos
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Coletar notícias
        run: node scripts/fetch-news.mjs
        continue-on-error: true
      - name: Gerar páginas (Gooners Law e ferramentas, sitemap)
        run: |
          node scripts/build-law.mjs
          node scripts/build.mjs
      # O GitHub Pages serve o branch gh-pages; cada execução o substitui pelo site recém-gerado.
      - name: Publicar no branch gh-pages
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir _site
          cp -r index.html assets categorias ferramentas favoritos law manifest.webmanifest robots.txt sitemap.xml sw.js .nojekyll _site/
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicar site (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
