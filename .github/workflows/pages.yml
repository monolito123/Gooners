name: Publicar site e atualizar notícias

on:
  push:
    branches: [main, claude/gooners-interactive-website-xszyfd]
  schedule:
    - cron: '*/15 * * * *'   # coleta as notícias jurídicas a cada 15 minutos
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Coletar notícias
        run: node scripts/fetch-news.mjs
        continue-on-error: true
      - name: Gerar páginas (Gooners Law e ferramentas, sitemap)
        run: |
          node scripts/build-law.mjs
          node scripts/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
